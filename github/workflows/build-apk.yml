
name: KM EDITOR APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -o KM_EDITOR_PHONE_APK_BUILD.zip -d source

      - name: Build web app
        run: |
          cd source
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd source/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KM-EDITOR-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
